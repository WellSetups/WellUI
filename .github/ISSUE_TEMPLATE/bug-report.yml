name: Bug report
description: Report a reproducible behavior problem.
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Remove passwords, tokens, private command arguments and personal data from every attachment. Financial exploits should use the private reporting policy in SECURITY.md.'
  - type: textarea
    id: environment
    attributes:
      label: Versions
      description: WellCost, Minecraft, server software/build, Java, Vault and economy provider versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include exact commands, permissions and expected versus actual behavior.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Minimal redacted configuration
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      description: Include transaction UUIDs where useful; do not upload an entire private database.
      render: text
